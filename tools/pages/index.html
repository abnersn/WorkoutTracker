<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workout Tracker Storybooks</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --card: #ffffff;
        --text: #1f2a37;
        --muted: #5b6b7f;
        --line: #dfe4ea;
        --accent: #2f5fd0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11151b;
          --card: #1a2029;
          --text: #e8ecf1;
          --muted: #9aa8b8;
          --line: #2a3340;
          --accent: #7ea2f5;
        }
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 0.25rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }
      a {
        display: block;
        padding: 1rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.5rem;
        color: var(--text);
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        border-color: var(--accent);
      }
      strong {
        color: var(--accent);
      }
      span {
        display: block;
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Workout Tracker</h1>
      <p>
        Component docs, one Storybook per micro-frontend. Built from
        <code>main</code>.
      </p>
      <ul>
        <li>
          <a href="ui/"
            ><strong>ui</strong
            ><span>Shared library: primitives and the workout screen</span></a
          >
        </li>
        <li>
          <a href="workout-new/"
            ><strong>workout-new</strong><span>Build and run a workout</span></a
          >
        </li>
        <li>
          <a href="workout-view/"
            ><strong>workout-view</strong
            ><span>A finished workout, read-only</span></a
          >
        </li>
        <li>
          <a href="workout-list/"
            ><strong>workout-list</strong><span>Saved workouts</span></a
          >
        </li>
        <li>
          <a href="workout-history/"
            ><strong>workout-history</strong><span>Past workouts</span></a
          >
        </li>
      </ul>
    </main>
  </body>
</html>
