services:
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on the first run; a no-op after that.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch {
          rs.initiate({ _id: 'rs0',
          members: [{ _id: 0, host: 'localhost:27017' }] }) }
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:
