syntax = "proto3";

package workouts.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Mirrors SetStage in client/libs/types. The value names are the client's strings
// ("IDLE", "ACTIVE", ...) so they match exactly with string enums on; that is
// why buf.yaml skips the enum prefix and zero-value rules.
enum SetStage {
  IDLE = 0;
  ACTIVE = 1;
  RESTING = 2;
  COMPLETE = 3;
}

// Mirrors WorkoutSet in client/libs/types.
message WorkoutSet {
  string id = 1;
  SetStage stage = 2;
  optional int32 default_reps = 3;
  optional double default_weight = 4; // always kg
  optional int32 default_rest_time = 5; // seconds
  // Epoch ms the set started resting, so a reloaded page resumes the countdown.
  optional int64 rest_started_at = 6;
}

// Mirrors Exercise in client/libs/types.
message Exercise {
  string id = 1;
  string name = 2;
  optional int32 rpe = 3; // 1 to 10
  repeated WorkoutSet sets = 4;
}

// Mirrors Workout in client/libs/types.
message Workout {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp date = 3;
  int32 duration = 4; // seconds
  bool is_complete = 5;
  optional string active_set_id = 6;
  optional string active_exercise_id = 7;
  repeated Exercise exercises = 8;
}

// Mirrors LogEntry in client/libs/types: a Workout (Workout & { workoutId })
// whose `id` identifies the log and `workout_id` the workout it was run
// from.
message LogEntry {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp date = 3;
  int32 duration = 4; // seconds
  bool is_complete = 5;
  optional string active_set_id = 6;
  optional string active_exercise_id = 7;
  repeated Exercise exercises = 8;
  string workout_id = 9;
  // Was persistence_key, an IndexedDB leftover; ids are the server's now.
  reserved 10;
  reserved "persistence_key";
}

service WorkoutsService {
  rpc ListWorkouts(ListWorkoutsRequest) returns (ListWorkoutsResponse);
  rpc GetWorkout(GetWorkoutRequest) returns (Workout);
  rpc CreateWorkout(CreateWorkoutRequest) returns (Workout);
  rpc UpdateWorkout(UpdateWorkoutRequest) returns (Workout);
  rpc DeleteWorkout(DeleteWorkoutRequest) returns (google.protobuf.Empty);
  rpc CreateLog(CreateLogRequest) returns (LogEntry);
  rpc ListLogs(ListLogsRequest) returns (ListLogsResponse);
  rpc GetLog(GetLogRequest) returns (LogEntry);
  rpc UpdateLog(UpdateLogRequest) returns (LogEntry);
  rpc DeleteLog(DeleteLogRequest) returns (google.protobuf.Empty);
  rpc GetLastRuns(GetLastRunsRequest) returns (GetLastRunsResponse);
  rpc GetPreviousRun(GetPreviousRunRequest) returns (GetPreviousRunResponse);
}

message ListWorkoutsRequest {}
message ListWorkoutsResponse {
  repeated Workout workouts = 1;
}
message GetWorkoutRequest {
  string id = 1;
}
message DeleteWorkoutRequest {
  string id = 1;
}
message CreateWorkoutRequest {
  Workout workout = 1;
}
message UpdateWorkoutRequest {
  Workout workout = 1; // matched by workout.id
}
message CreateLogRequest {
  LogEntry log = 1;
}
message GetLogRequest {
  string id = 1;
}
message UpdateLogRequest {
  LogEntry log = 1; // matched by log.id
}
message DeleteLogRequest {
  string id = 1;
}
message ListLogsRequest {}
message ListLogsResponse {
  repeated LogEntry logs = 1;
}

// The newest log date of each requested workout, for the gateway's
// lastRunAt DataLoader. Workouts that were never run, or that aren't the
// caller's, are left out of the response.
message GetLastRunsRequest {
  repeated string workout_ids = 1;
}
message LastRun {
  string workout_id = 1;
  google.protobuf.Timestamp last_run_at = 2;
}
message GetLastRunsResponse {
  repeated LastRun last_runs = 1;
}

// The run of the same workout just before the given log: the caller's
// newest log with that workout_id and an earlier date. Lets the history
// view compare a run against the last one without listing every log.
message GetPreviousRunRequest {
  string log_id = 1;
}
message GetPreviousRunResponse {
  // Unset when the log is its workout's first run.
  LogEntry log = 1;
}
