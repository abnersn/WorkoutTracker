name: Deploy

# Tag-driven releases, one Zephyr environment per tag pattern:
#   staging-*  ->  staging      (e.g. staging-2026.11.14)
#   v*         ->  production   (e.g. v1.4.0)
on:
  push:
    tags:
      - "staging-*"
      - "v*"

# Never run two deploys of the same environment at once.
concurrency:
  group: deploy-${{ startsWith(github.ref_name, 'staging-') && 'staging' || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ZE_CI_TOKEN: ${{ secrets.ZEPHYR_CI_TOKEN }}
      ZE_FAIL_BUILD: true
      ZE_ENV: ${{ startsWith(github.ref_name, 'staging-') && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm

      - run: npm ci

      # Builds and deploys the four remotes, then the shell (see the `deploy`
      # target's dependsOn in client/shell/project.json).
      - run: npx nx run shell:deploy
