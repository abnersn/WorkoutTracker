name: Storybook

# Publishes every Storybook to GitHub Pages as one composed view. Always built from main: the
# trigger is a push to main, and manual runs are refused on any other branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # One view: the ui Storybook is the host, and the other four load inside
      # it through Storybook's composition (refs in client/ui/.storybook).
      # Refs need absolute URLs, so the host is built knowing the site address.
      - name: Build every Storybook
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          export STORYBOOK_SITE_URL="https://$owner.github.io/${GITHUB_REPOSITORY#*/}"
          npx nx run-many -t build-storybook

      # The host sits at the site root, each remote in its own folder.
      - name: Assemble the site
        run: |
          cp -r client/ui/storybook-static site
          for project in workout-list workout-new workout-view workout-history; do
            cp -r "client/$project/storybook-static" "site/$project"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
