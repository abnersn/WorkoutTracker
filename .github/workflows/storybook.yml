name: Storybook

# Publishes every Storybook to GitHub Pages. Always built from main: the
# trigger is a push to main, and manual runs are refused on any other branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Build every Storybook
        run: npx nx run-many -t build-storybook

      # One folder per Storybook, plus a landing page that links to them.
      - name: Assemble the site
        run: |
          mkdir site
          for project in ui workout-list workout-new workout-view workout-history; do
            cp -r "client/$project/storybook-static" "site/$project"
          done
          cp tools/pages/index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
